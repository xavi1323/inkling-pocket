name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-latest
    container: swift:6.4.3-bookworm
    steps:
      - uses: actions/checkout@v7
      - name: Swift tests (pure-logic targets)
        run: swift test --package-path InklingKit

  ios-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (unsigned, iphoneos)
        run: |
          xcodebuild -project InklingPocket.xcodeproj -scheme InklingPocket -sdk iphoneos \
            -configuration Release -derivedDataPath out CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 \
            || { grep -E "error:" build.log | head -50; tail -40 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -30 || true
      - name: Package tests (macOS, Apple targets included)
        working-directory: InklingKit
        run: |
          xcodebuild test -scheme InklingKit-Package -destination 'platform=macOS' \
            -skipMacroValidation -skipPackagePluginValidation > ../test.log 2>&1 \
            || { grep -E "error:|failed|✘" ../test.log | head -60; tail -60 ../test.log; exit 1; }
          grep -E "Test run with|Executed" ../test.log | tail -5
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R out/Build/Products/Release-iphoneos/InklingPocket.app Payload/
          zip -qr InklingPocket.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: InklingPocket-ipa
          path: InklingPocket.ipa
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-log
          path: |
            build.log
            test.log
